<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Assets carry ?v=N. GitHub Pages serves them with a 10 minute cache, so bump
     N on every deploy or returning players keep the old files. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>State the Facts!</title>
<meta name="description" content="Learn the lower 48 states and the biggest U.S. cities by clicking them on a map with no state lines — just terrain, rivers and coast.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1219'/%3E%3Cpath d='M4 21l6-8 4.5 5.5L19 11l9 10z' fill='none' stroke='%23e2b558' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=44">
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>State the Facts!</h1>
    <div class="topbar-right">
      <button class="switch switch-cool is-on" id="terrainBtn" role="switch" aria-checked="true"
              title="Shaded relief, rivers, lakes and their names"><span class="track"><span class="knob"></span></span>Terrain</button>
      <button class="switch switch-cool" id="peekBtn" role="switch" aria-checked="false"
              title="Show all state boundaries"><span class="track"><span class="knob"></span></span>Peek</button>
      <button class="switch switch-cool" id="regionsBtn" role="switch" aria-checked="false"
              title="Shade every state by its region"><span class="track"><span class="knob"></span></span>Regions</button>
      <nav class="modes" id="modes">
        <button class="mode-btn is-on" data-mode="states">States</button>
        <button class="mode-btn" data-mode="cities">Cities</button>
        <button class="mode-btn" data-mode="trivia">Trivia</button>
      </nav>
    </div>
  </header>

  <section class="hud" id="hud">
    <div class="ask">
      <span class="ask-label" id="askLabel">Where is</span>
      <span class="ask-target" id="prompt">—</span>
    </div>
    <div class="stats">
      <div class="streak" id="streak" title="First-try answers in a row"><span class="flame">🔥</span><b id="streakCount">0</b></div>
      <div class="tries" id="tries" title="Tries left"></div>
      <div class="counter"><b id="progress">0</b><span id="progressTotal">/ 48</span></div>
    </div>
  </section>

  <div class="feedback" id="feedback">&nbsp;</div>

  <div class="mapwrap">
    <canvas id="map"></canvas>
    <button class="reset-view" id="resetView" title="Back to the whole map">Reset view</button>
    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="burst" id="burst" aria-live="polite"></div>

    <aside class="legend" id="regionLegend" hidden>
      <ul class="legend-list" id="legendList"></ul>
    </aside>

    <div class="overlay" id="overlay">
      <div class="panel" id="panel"></div>
    </div>
  </div>

  <footer class="bottombar">
    <div class="meters">
      <span>Score <b id="score">0</b></span>
      <span>First try <b id="firstTry">0</b></span>
      <span>Time <b id="timer">0:00</b></span>
    </div>
    <div class="actions">
      <button class="btn ghost" id="menuBtn">Menu</button>
      <button class="btn ghost" id="restartBtn">Restart</button>
    </div>
    <div class="version" id="version">v44</div>
  </footer>
</div>

<script src="data/states.js?v=44"></script>
<script src="data/cities.js?v=44"></script>
<script src="data/water.js?v=44"></script>
<script src="data/features.js?v=44"></script>
<script src="data/relief.js?v=44"></script>
<script src="data/regions.js?v=44"></script>
<script src="data/trivia.js?v=44"></script>
<script src="js/geo.js?v=44"></script>
<script src="js/map.js?v=44"></script>
<script src="js/regions.js?v=44"></script>
<script src="js/game.js?v=44"></script>

<script>
/* Every asset carries ?v=N, but index.html itself cannot — and GitHub Pages
   serves it with a ten minute cache. So a returning player can hold a stale
   page that then asks for stale assets, and sees an old build with no clue
   that it is old. Ask the server which build is current; if this page is
   behind, reload once past the cache. Best-effort and silent: any failure
   leaves the page exactly as it is. */
(function () {
  if (typeof fetch !== 'function') return;
  var stamp = document.getElementById('version');
  if (!stamp) return;
  var build = stamp.textContent.trim().replace(/^v/, '');
  if (!build) return;

  var tried = null;
  try {
    tried = sessionStorage.getItem('usgeo.staleReload');
  } catch (e) {
    return; // no sessionStorage means no loop guard, so do not risk reloading
  }

  fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (text) {
      if (text === null) return;
      var latest = text.trim();
      if (!latest || latest === build) return;
      // Only one attempt per build, so a reload that does not help cannot loop.
      if (tried === latest) return;
      sessionStorage.setItem('usgeo.staleReload', latest);
      // A plain reload can be answered from cache again; a new query cannot.
      location.replace(location.pathname + '?b=' + encodeURIComponent(latest));
    })
    .catch(function () {});
})();
</script>
</body>
</html>
<!-- v44 deployment -->
