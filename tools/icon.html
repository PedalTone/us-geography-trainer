<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Icon preview</title></head>
<body style="margin:0;background:#333;display:flex;gap:20px;align-items:flex-start;padding:20px">
<!-- Interactive preview of the icon at home-screen sizes. Call
     render('ask') or render('plain') from the console to compare variants.
     icon-render.html is what the build actually screenshots. -->
<script src="../data/states.js"></script>
<script src="../js/geo.js"></script>
<script src="icon-draw.js"></script>
<script>
window.render = function (variant, sizes) {
  document.body.innerHTML = '';
  (sizes || [1024, 180, 120, 60]).forEach(function (s) {
    var c = drawIcon(s, variant || 'ask');
    c.style.width = Math.min(s, 300) + 'px';
    c.style.borderRadius = '22%';   // preview as iOS will mask it
    c.style.alignSelf = 'flex-start';
    document.body.appendChild(c);
  });
};
render('ask');
</script>
</body>
</html>
